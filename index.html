<script>
    const apiBaseUrl = "https://Bilal1212.pythonanywhere.com"; 
    let currentTimeframe = "M15";
    let currentPair = "XAUUSD";
    
    let isLoggedIn = localStorage.getItem("gold_logged_in") === "true";
    let isAdmin = localStorage.getItem("gold_is_admin") === "true";
    let currentUsername = localStorage.getItem("gold_username") || "";
    let userPermissions = {
        can_signal: parseInt(localStorage.getItem("gold_can_signal") || "1"),
        can_history: parseInt(localStorage.getItem("gold_can_history") || "1")
    };

    let deviceId = localStorage.getItem("device_id") || ('dev_' + Math.random().toString(36).substring(2, 15));
    localStorage.setItem("device_id", deviceId);

    window.onload = function() {
        checkMarketStatus();
        fetchLiveNews();
        let today = new Date().toISOString().split('T')[0];
        if(document.getElementById("newStartDate")) document.getElementById("newStartDate").value = today;

        if (isLoggedIn) {
            document.getElementById("loginView").style.display = "none";
            if (isAdmin) {
                document.getElementById("adminView").style.display = "block";
                loadAdminUsers();
            } else {
                document.getElementById("userProfileView").style.display = "block";
                loadUserProfile(currentUsername);
            }
        }
    }

    function checkMarketStatus() {
        fetch(`${apiBaseUrl}/market_status`).then(res => res.json()).then(data => {
            let statusEl = document.getElementById("marketStatus");
            if(statusEl) {
                statusEl.innerText = data.status;
                statusEl.style.color = data.status === "ONLINE" ? "#00ff88" : "#ff3366";
            }
        }).catch(err => console.log(err));
    }

    function fetchLiveNews() {
        fetch(`${apiBaseUrl}/get_news`).then(res => res.json()).then(data => {
            let container = document.getElementById("newsContainer");
            if(container && data.status === "success" && data.news.length > 0) {
                container.innerHTML = "";
                data.news.forEach(item => {
                    container.innerHTML += `<div class="news-item"><div class="news-time"><span>📅 ${item.time}</span><span style="color:#00ffff;">${item.currency}</span></div><div class="news-title">${item.title}</div></div>`;
                });
            }
        }).catch(err => console.log(err));
    }

    function selectTimeframe(element) {
        document.querySelectorAll(".time-box").forEach(b => b.classList.remove("active"));
        element.classList.add("active");
        currentTimeframe = element.innerText;
    }

    function selectPair(element, pairCode, pairName) {
        document.querySelectorAll(".pair-box").forEach(b => b.classList.remove("active"));
        element.classList.add("active");
        currentPair = pairCode;
        document.getElementById("dropdownText").innerText = pairName;
    }

    function changeLot(amount) {
        let lotInput = document.getElementById("lotSize");
        let newVal = (parseFloat(lotInput.value) + amount).toFixed(2);
        if (newVal >= 0.01) lotInput.value = newVal;
    }

    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');

        if(tabId === 'profileTab' && isLoggedIn && !isAdmin) {
            loadUserProfile(currentUsername);
        }
    }

    function generateSignal() {
        if (!isLoggedIn) {
            alert("For Generate signal Contact with Admin for user name and password. Contact NO: 03064975019 / 03040693487");
            switchTab('profileTab', document.querySelectorAll('.nav-item')[3]);
            return;
        }

        if (userPermissions.can_signal === 0) {
            alert("Your Signal access has been disabled by Admin!");
            return;
        }

        let btn = document.getElementById("generateBtn");
        let signalBox = document.getElementById("signalBox");
        let signalText = document.getElementById("signalText");

        btn.innerText = "FETCHING LIVE DATA...";
        btn.disabled = true;
        signalBox.className = "signal-action";
        signalText.innerText = "ANALYZING...";
        document.getElementById("detailsTable").style.display = "none";

        fetch(`${apiBaseUrl}/get_signal?tf=${currentTimeframe}&pair=${currentPair}`)
        .then(res => res.json())
        .then(data => {
            if(data.error) throw new Error(data.error);

            if (data.direction.includes("BUY")) signalBox.className = "signal-action signal-buy";
            else if (data.direction.includes("SELL")) signalBox.className = "signal-action signal-sell";
            
            signalText.innerText = data.direction;
            document.getElementById("displayPair").innerText = data.pair;
            document.getElementById("entryValue").innerText = data.entry_price;
            document.getElementById("slValue").innerText = data.stop_loss;
            document.getElementById("tpValue").innerText = data.take_profit;
            
            let statVal = document.getElementById("statusValue");
            if(statVal) statVal.innerText = data.status || "ACTIVE";

            if (userPermissions.can_history === 1) {
                let historyList = document.getElementById("historyList");
                if(document.getElementById("noHistoryText")) document.getElementById("noHistoryText").style.display = "none";
                
                let timeNow = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                let isBuy = data.direction.includes("BUY");
                let hBorder = isBuy ? "" : "history-sell";
                let hColor = isBuy ? "text-green" : "text-red";
                
                historyList.insertAdjacentHTML('afterbegin', `
                    <div class="history-card ${hBorder}" style="background:#141e30; padding:10px; border-radius:8px; margin-bottom:8px; border-left:4px solid #00ffff;">
                        <div><div style="font-weight:bold; color:white;">${data.pair} <span style="font-size: 12px; color:#00ffff;">(${currentTimeframe})</span></div>
                        <div class="${hColor}" style="font-size: 14px; font-weight:bold; margin-top:2px;">${data.direction} @ ${data.entry_price}</div></div>
                    </div>
                `);
            }

            document.getElementById("detailsTable").style.display = "block";
            btn.innerText = "GENERATE SIGNAL";
            btn.disabled = false;
        })
        .catch(error => {
            signalText.innerText = "MARKET CLOSED / ERROR";
            btn.innerText = "TRY AGAIN";
            btn.disabled = false;
        });
    }

    function realLogin() {
        let user = document.getElementById("loginUser").value;
        let pass = document.getElementById("loginPass").value;
        fetch(`${apiBaseUrl}/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: user, password: pass, device_id: deviceId})
        }).then(res => res.json()).then(data => {
            let msg = document.getElementById("loginMsg");
            msg.style.display = "block";
            if(data.status === "success") {
                isLoggedIn = true; 
                currentUsername = user;
                userPermissions.can_signal = data.can_signal;
                userPermissions.can_history = data.can_history;

                localStorage.setItem("gold_logged_in", "true");
                localStorage.setItem("gold_username", user);
                localStorage.setItem("gold_can_signal", data.can_signal);
                localStorage.setItem("gold_can_history", data.can_history);

                msg.innerText = "Login Successful!";
                msg.style.color = "#00ff88";
                setTimeout(() => {
                    document.getElementById("loginView").style.display = "none";
                    if(user === "admin") {
                        isAdmin = true;
                        localStorage.setItem("gold_is_admin", "true");
                        document.getElementById("adminView").style.display = "block";
                        loadAdminUsers();
                    } else {
                        isAdmin = false;
                        localStorage.setItem("gold_is_admin", "false");
                        document.getElementById("userProfileView").style.display = "block";
                        loadUserProfile(user);
                        switchTab('signalTab', document.querySelectorAll('.nav-item')[1]);
                    }
                }, 1000);
            } else {
                msg.innerText = data.message;
                msg.style.color = "#ff3366";
            }
        });
    }

    function loadUserProfile(username) {
        fetch(`${apiBaseUrl}/get_user_profile?username=${username}`)
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                document.getElementById("pUser").innerText = data.username;
                document.getElementById("pIdCard").innerText = data.id_card || "N/A";
                document.getElementById("pPhone").innerText = data.phone || "N/A";
                document.getElementById("pStart").innerText = data.start_date || "N/A";
                document.getElementById("pEnd").innerText = data.end_date || "N/A";
                if(data.profile_pic) {
                    document.getElementById("userProfileImg").src = data.profile_pic;
                }
            }
        });
    }

    function uploadProfilePic(event) {
        let file = event.target.files[0];
        if(file) {
            let reader = new FileReader();
            reader.onload = function(e) {
                let base64Img = e.target.result;
                document.getElementById("userProfileImg").src = base64Img;
                
                fetch(`${apiBaseUrl}/update_profile_pic`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: currentUsername, profile_pic: base64Img})
                }).then(res => res.json()).then(data => {
                    alert(data.message);
                });
            }
            reader.readAsDataURL(file);
        }
    }

    function loadAdminUsers() {
        fetch(`${apiBaseUrl}/get_users`).then(res => res.json()).then(data => {
            if(data.status === "success") {
                let container = document.getElementById("usersListContainer");
                container.innerHTML = "";
                data.users.forEach(u => {
                    if(u.username !== "admin") {
                        let isCheckedActive = u.status === 'active' ? 'checked' : '';
                        container.innerHTML += `
                            <div class="user-row">
                                <div style="display:flex; align-items:center; gap:10px; margin-bottom:5px;">
                                    <img src="${u.profile_pic || 'https://via.placeholder.com/40'}" style="width:40px; height:40px; border-radius:50%; border:1px solid #00ffff; object-fit:cover;">
                                    <div><b>User:</b> ${u.username} | <b>Pass:</b> ${u.password}</div>
                                </div>
                                <b>ID:</b> ${u.id_card} | <b>Phone:</b> ${u.phone}<br>
                                <b>Start:</b> <input type="date" id="start_${u.username}" value="${u.start_date || ''}" style="background:#0d1424; color:white; border:1px solid #1f2a40; padding:2px; font-size:11px;"><br>
                                <b>Expiry:</b> <input type="date" id="end_${u.username}" value="${u.end_date || ''}" style="background:#0d1424; color:white; border:1px solid #1f2a40; padding:2px; font-size:11px;"><br>
                                <label><input type="checkbox" id="status_${u.username}" ${isCheckedActive}> Active</label>
                                <label style="margin-left:5px;"><input type="checkbox" id="sig_${u.username}" ${u.can_signal ? 'checked' : ''}> Signal</label>
                                <label style="margin-left:5px;"><input type="checkbox" id="hist_${u.username}" ${u.can_history ? 'checked' : ''}> History</label>
                                <br><button onclick="updateUser('${u.username}')" style="background:#00ff88; border:none; color:black; padding:3px 8px; border-radius:4px; margin-top:5px; font-weight:bold;">Update</button>
                                <button onclick="deleteUser('${u.username}')" style="background:#ff3366; border:none; color:white; padding:3px 8px; border-radius:4px; margin-top:5px; float:right;">Delete</button>
                            </div>`;
                    }
                });
            }
        });
    }

    function updateUser(username) {
        if (!isAdmin) return;
        let status = document.getElementById(`status_${username}`).checked ? 'active' : 'disabled';
        let can_signal = document.getElementById(`sig_${username}`).checked ? 1 : 0;
        let can_history = document.getElementById(`hist_${username}`).checked ? 1 : 0;
        let start_date = document.getElementById(`start_${username}`).value;
        let end_date = document.getElementById(`end_${username}`).value;

        fetch(`${apiBaseUrl}/update_user`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, status, can_signal, can_history, start_date, end_date})
        }).then(res => res.json()).then(data => {
            alert(data.message);
            loadAdminUsers();
        });
    }

    function deleteUser(username) {
        if (!isAdmin) return;
        fetch(`${apiBaseUrl}/delete_user`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username})
        }).then(res => res.json()).then(data => loadAdminUsers());
    }

    function createNewUser() {
        if (!isAdmin) {
            alert("Only Admin can create new users!");
            return;
        }
        let user = document.getElementById("newUsername").value;
        let pass = document.getElementById("newPassword").value;
        let idCard = document.getElementById("newIdCard").value;
        let phone = document.getElementById("newPhone").value;
        let startDate = document.getElementById("newStartDate").value;
        let endDate = document.getElementById("newEndDate").value;

        if (!user || !pass || !idCard || !phone || !endDate) {
            let msg = document.getElementById("adminMsg");
            msg.style.display = "block";
            msg.innerText = "Please fill all fields including End Date!";
            msg.style.color = "#ff3366";
            return;
        }

        fetch(`${apiBaseUrl}/create_user`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: user, password: pass, id_card: idCard, phone: phone, start_date: startDate, end_date: endDate})
        }).then(res => res.json()).then(data => {
            let msg = document.getElementById("adminMsg");
            msg.style.display = "block";
            msg.innerText = data.message;
            msg.style.color = data.status === "success" ? "#00ff88" : "#ff3366";
            if(data.status === "success") {
                document.getElementById("newUsername").value = "";
                document.getElementById("newPassword").value = "";
                document.getElementById("newIdCard").value = "";
                document.getElementById("newPhone").value = "";
                loadAdminUsers();
            }
        });
    }

    function logoutUser() {
        isLoggedIn = false;
        isAdmin = false;
        currentUsername = "";
        localStorage.removeItem("gold_logged_in");
        localStorage.removeItem("gold_is_admin");
        localStorage.removeItem("gold_username");
        localStorage.removeItem("gold_can_signal");
        localStorage.removeItem("gold_can_history");
        document.getElementById("userProfileView").style.display = "none";
        document.getElementById("loginView").style.display = "block";
    }

    function logoutAdmin() {
        logoutUser();
    }
</script>
